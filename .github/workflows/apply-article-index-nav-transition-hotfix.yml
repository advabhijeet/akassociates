name: Apply Article Index Nav Transition Hotfix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-article-index-nav-transition-hotfix.yml'
      - '.github/workflows/apply-article-index-nav-transition-hotfix-v2.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.head_ref == 'agent/fix-article-index-nav-transition'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch Article Index transition synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('assets/js/themes/citadel-of-kang/article-index-direct-rail.js')
          text = path.read_text(encoding='utf-8')
          marker = "\n  links.forEach(function (link) {\n"
          payload = ''
          hotfix = base64.b64decode(payload).decode('utf-8')

          if 'var navTransitionFrame = null;' in text:
              raise SystemExit('Article Index nav-transition hotfix is already present')
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one Article Index insertion marker, found {text.count(marker)}')

          path.write_text(text.replace(marker, hotfix + marker, 1), encoding='utf-8', newline='\n')
          PY

          node --check assets/js/themes/citadel-of-kang/article-index-direct-rail.js

      - name: Install Chromium test runtime
        run: |
          npm install --silent --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run fresh-load rail regression
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cak-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          node <<'NODE'
          const { chromium } = require('playwright');
          const parseY = (value) => {
            if (!value || value === 'none') return 0;
            const matrix = value.match(/^matrix\((.+)\)$/);
            if (matrix) return Number(matrix[1].split(',')[5]);
            const matrix3d = value.match(/^matrix3d\((.+)\)$/);
            return matrix3d ? Number(matrix3d[1].split(',')[13]) : 0;
          };
          const assert = (condition, message, details) => {
            if (!condition) throw new Error(`${message}\n${JSON.stringify(details, null, 2)}`);
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
              await page.goto('http://127.0.0.1:4173/updates/msme-facilitation-council-process.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForSelector('.article-index-toc a.is-active', { timeout: 15000 });
              await page.waitForSelector('.site-topbar', { timeout: 10000 });
              await page.waitForTimeout(250);

              const geometry = await page.evaluate(() => {
                const article = document.querySelector('article[data-citadel-article-index], article.article-body, article.ck-article');
                const rect = article.getBoundingClientRect();
                return { top: window.scrollY + rect.top, height: article.offsetHeight, max: document.documentElement.scrollHeight - window.innerHeight };
              });
              const mid = Math.min(geometry.max, Math.round(geometry.top + Math.min(geometry.height * 0.42, 1800)));
              const deeper = Math.min(geometry.max, Math.max(mid + 500, Math.round(geometry.top + geometry.height * 0.68)));

              const snapshot = () => page.evaluate(() => {
                const toc = document.querySelector('.article-index-toc');
                const article = document.querySelector('article[data-citadel-article-index], article.article-body, article.ck-article');
                const nav = document.querySelector('.nav');
                const active = toc.querySelector('a.is-active');
                const tocRect = toc.getBoundingClientRect();
                const articleRect = article.getBoundingClientRect();
                return {
                  transform: getComputedStyle(toc).transform,
                  tocScrollTop: toc.scrollTop,
                  tocTop: tocRect.top,
                  tocDocumentBottom: window.scrollY + tocRect.bottom,
                  articleDocumentBottom: window.scrollY + articleRect.bottom,
                  navBottom: nav.getBoundingClientRect().bottom,
                  activeHref: active ? active.getAttribute('href') : null,
                  scrollWidth: document.documentElement.scrollWidth,
                  innerWidth: window.innerWidth,
                };
              });

              await page.evaluate((y) => window.scrollTo(0, y), mid);
              await page.waitForTimeout(140);
              const moving = await snapshot();
              assert(Math.abs((moving.tocTop - moving.navBottom) - 18) <= 2, 'Tray is not aligned while nav compacts', moving);

              await page.waitForTimeout(520);
              const down = await snapshot();
              await page.evaluate((y) => window.scrollTo(0, y), deeper);
              await page.waitForTimeout(650);
              await page.evaluate((y) => window.scrollTo(0, y), mid);
              await page.waitForTimeout(650);
              const up = await snapshot();
              assert(Math.abs(parseY(down.transform) - parseY(up.transform)) <= 1, 'Stable down/up transforms differ', { down, up });
              assert(down.tocScrollTop === 0 && up.tocScrollTop === 0, 'Internal tray scrolling detected', { down, up });
              assert(down.activeHref === up.activeHref, 'Active heading is stale after upward scroll', { down, up });
              assert(down.scrollWidth <= down.innerWidth, 'Horizontal overflow detected', down);

              let end = null;
              for (let attempt = 0; attempt < 3; attempt += 1) {
                const maximum = await page.evaluate(() => Math.max(0, document.documentElement.scrollHeight - window.innerHeight));
                await page.evaluate((y) => window.scrollTo(0, y), maximum);
                await page.waitForTimeout(650);
                end = await snapshot();
              }
              assert(Math.abs(end.tocDocumentBottom - end.articleDocumentBottom) <= 2, 'Article-bottom clamp failed', end);
              console.log(JSON.stringify({ status: 'PASS', moving, down, up, end }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

      - name: Run repository validators
        shell: bash
        run: |
          node tools/validate-public-assets.js
          node tools/validate-performance-remediation.js
          node tools/validate-citadel-runtime.js
          node tools/validate-documentation.js
          git diff --check

      - name: Commit tested hotfix to branch
        shell: bash
        run: |
          rm .github/workflows/apply-article-index-nav-transition-hotfix.yml
          rm .github/workflows/apply-article-index-nav-transition-hotfix-v2.yml
          git config user.name "Chambers Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/themes/citadel-of-kang/article-index-direct-rail.js .github/workflows/apply-article-index-nav-transition-hotfix.yml .github/workflows/apply-article-index-nav-transition-hotfix-v2.yml
          git commit -m "Keep Article Index aligned during nav transition"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
