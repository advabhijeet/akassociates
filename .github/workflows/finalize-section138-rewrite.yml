name: Finalize Section 138 NI Act Rewrite

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-section138-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    name: patch-test-and-commit
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/rewrite-section138-ni-act-overview'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply approved Section 138 metadata
        run: |
          set -euo pipefail
          node .github/scripts/finalize-section138-rewrite.js
          node tools/sync-static-insight-cards.js
          node tools/sync-rss-feed.js

      - name: Syntax and generated-output checks
        run: |
          set -euo pipefail
          node --check .github/scripts/finalize-section138-rewrite.js
          node --check .github/scripts/test-section138-rewrite.js
          node --check tools/sync-static-insight-cards.js
          node --check tools/sync-rss-feed.js
          node -e "JSON.parse(require('fs').readFileSync('assets/data/insights-registry.json','utf8'))"
          node tools/sync-static-insight-cards.js --check
          node tools/sync-rss-feed.js --check

      - name: Install Chromium test runtime
        run: |
          set -euo pipefail
          PLAYWRIGHT_ROOT="$RUNNER_TEMP/section138-playwright"
          mkdir -p "$PLAYWRIGHT_ROOT"
          npm install --prefix "$PLAYWRIGHT_ROOT" playwright@latest
          "$PLAYWRIGHT_ROOT/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run Section 138 browser regression
        env:
          NODE_PATH: ${{ runner.temp }}/section138-playwright/node_modules
        run: node .github/scripts/test-section138-rewrite.js

      - name: Run publication validators
        run: |
          set -euo pipefail
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
          node tools/sync-static-insight-cards.js --check
          node tools/sync-rss-feed.js --check
          node tools/audit-articles-structure.js --strict
          node tools/validate-seo-sitewide.js
          node tools/validate-deployment-boundary.js
          node tools/validate-documentation.js
          node tools/validate-public-assets.js
          node tools/validate-performance-remediation.js
          node tools/validate-service-consolidation.js
          node tools/validate-citadel-runtime.js
          git diff --check

      - name: Commit tested production package
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f \
            .github/workflows/finalize-section138-rewrite.yml \
            .github/scripts/finalize-section138-rewrite.js \
            .github/scripts/test-section138-rewrite.js

          git add \
            CHANGELOG.md \
            assets/data/insights-registry.json \
            feed.xml \
            legal-updates.html \
            sitemap.xml \
            updates/section-138-cheque-bounce-limitation.html

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No production changes to commit." >&2
            exit 1
          fi

          git commit -m "Rewrite Section 138 NI Act authority guide"
          git push origin "HEAD:${HEAD_BRANCH}"
