name: Finalize Section 21 Arbitration Rewrite

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-section21-rewrite.yml'
      - 'tools/tmp-finalize-section21-rewrite.py'
      - 'tools/tmp-test-section21-rewrite.cjs'
      - 'updates/arbitration-notice-before-claim.html'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.head_ref == 'agent/rewrite-section21-arbitration-commencement'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/rewrite-section21-arbitration-commencement
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply approved metadata updates
        run: |
          python3 tools/tmp-finalize-section21-rewrite.py
          node tools/sync-static-insight-cards.js
          node tools/sync-rss-feed.js

      - name: JavaScript and data syntax checks
        run: |
          node --check assets/js/script.js
          node --check tools/sync-static-insight-cards.js
          node --check tools/sync-rss-feed.js
          node -e "JSON.parse(require('fs').readFileSync('assets/data/insights-registry.json','utf8'))"

      - name: Install Chromium test runtime
        run: |
          npm install --silent --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run Section 21 browser regression
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cak-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tools/tmp-test-section21-rewrite.cjs

      - name: Run publication validators
        run: |
          set -euo pipefail
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
          node tools/sync-static-insight-cards.js --check
          node tools/sync-rss-feed.js --check
          node tools/audit-articles-structure.js --strict
          node tools/validate-seo-sitewide.js
          node tools/validate-deployment-boundary.js
          node tools/validate-documentation.js
          node tools/validate-public-assets.js
          node tools/validate-performance-remediation.js
          node tools/validate-service-consolidation.js
          node tools/validate-citadel-runtime.js
          git diff --check

      - name: Commit tested production package
        run: |
          rm .github/workflows/finalize-section21-rewrite.yml
          rm tools/tmp-finalize-section21-rewrite.py
          rm tools/tmp-test-section21-rewrite.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md assets/data/insights-registry.json feed.xml legal-updates.html sitemap.xml
          git add -u .github/workflows tools
          git commit -m "Finalize Section 21 arbitration commencement guide"
          git push origin HEAD:agent/rewrite-section21-arbitration-commencement
