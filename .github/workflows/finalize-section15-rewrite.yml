name: Finalize Section 15 MSMED Rewrite

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-section15-rewrite.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.head_ref == 'agent/draft-section-15-msmed-payment'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/draft-section-15-msmed-payment
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply approved Section 15 rewrite
        run: |
          python3 tools/tmp-apply-section15-rewrite.py
          node tools/sync-static-insight-cards.js
          node tools/sync-rss-feed.js

      - name: JavaScript and data syntax checks
        run: |
          node --check assets/js/script.js
          node --check assets/js/config/chambers-public-config.js
          node --check assets/js/themes/citadel-of-kang/article-index-direct-rail.js
          node --check tools/sync-static-insight-cards.js
          node --check tools/sync-rss-feed.js
          node -e "JSON.parse(require('fs').readFileSync('assets/data/insights-registry.json','utf8')); console.log('Insights registry JSON valid')"

      - name: Install Chromium test runtime
        run: |
          npm install --silent --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run Section 15 browser regression
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cak-section15-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tools/tmp-test-section15-rewrite.cjs

      - name: Run publication validators
        run: |
          set -euo pipefail
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
          node tools/sync-static-insight-cards.js --check
          node tools/sync-rss-feed.js --check
          node tools/audit-articles-structure.js --strict
          node tools/validate-seo-sitewide.js
          node tools/validate-deployment-boundary.js
          node tools/validate-documentation.js
          node tools/validate-public-assets.js
          node tools/validate-performance-remediation.js
          node tools/validate-service-consolidation.js
          node tools/validate-citadel-runtime.js
          git diff --check

      - name: Commit tested production package
        run: |
          rm docs/drafts/SECTION_15_MSMED_PAYMENT_REWRITE_REVIEW.md
          rm tools/tmp-apply-section15-rewrite.py
          rm tools/tmp-test-section15-rewrite.cjs
          rm .github/workflows/finalize-section15-rewrite.yml

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            updates/msme-45-days-payment-rule.html \
            assets/data/insights-registry.json \
            sitemap.xml \
            index.html \
            legal-updates.html \
            feed.xml \
            CHANGELOG.md \
            docs/drafts/SECTION_15_MSMED_PAYMENT_REWRITE_REVIEW.md \
            tools/tmp-apply-section15-rewrite.py \
            tools/tmp-test-section15-rewrite.cjs \
            .github/workflows/finalize-section15-rewrite.yml

          git diff --cached --check
          git commit -m "Rewrite Section 15 MSMED payment guide"
          git push origin HEAD:agent/draft-section-15-msmed-payment
