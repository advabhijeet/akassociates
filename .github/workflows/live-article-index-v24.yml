name: Live Article Index v24 Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/live-article-index-v24.yml'
      - 'tools/live-verify-article-index-v24.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-article-index-v24-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-site:
    name: Verify deployed Article Index v24
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live deployment and browser behavior
        run: node tools/live-verify-article-index-v24.cjs
