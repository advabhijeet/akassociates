name: Finalize Registry-Driven RSS

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-finalize-rss-sync.yml'
      - 'tools/tmp-finalize-rss-sync.js'
      - 'tools/sync-rss-feed.js'

permissions:
  contents: write

jobs:
  finalize-test-and-commit:
    if: github.head_ref == 'agent/sync-rss-with-insights-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout RSS branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-rss-with-insights-registry
          fetch-depth: 0

      - name: Apply RSS workflow updates
        run: |
          node tools/tmp-finalize-rss-sync.js
          node tools/sync-rss-feed.js

      - name: JavaScript syntax checks
        run: |
          node --check tools/sync-rss-feed.js
          node --check assets/js/script.js
          node --check assets/js/config/chambers-public-config.js
          node --check assets/js/themes/citadel-of-kang/article-index-direct-rail.js

      - name: Run repository validators
        run: |
          set -euo pipefail
          node tools/sync-rss-feed.js --check
          node tools/validate-public-assets.js
          node tools/validate-documentation.js
          node tools/validate-deployment-boundary.js
          node tools/validate-performance-remediation.js
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
          node tools/sync-static-insight-cards.js --check
          node tools/audit-articles-structure.js --strict
          node tools/validate-seo-sitewide.js
          node tools/validate-service-consolidation.js
          node tools/validate-citadel-runtime.js
          git diff --check

      - name: Commit tested RSS synchronization
        run: |
          rm .github/workflows/tmp-finalize-rss-sync.yml
          rm tools/tmp-finalize-rss-sync.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate RSS from the Insights Registry"
          git push origin HEAD:agent/sync-rss-with-insights-registry
