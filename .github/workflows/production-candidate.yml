name: AK-009D production candidate and Lighthouse
on:
  push:
    branches: [astro-migration]
    paths:
      - '.github/workflows/production-candidate.yml'
      - 'astro-site/deployment/**'
      - 'astro-site/scripts/prepare-production.mjs'
      - 'astro-site/scripts/test-production.mjs'
      - 'astro-site/scripts/test-production-browser.mjs'
      - 'astro-site/src/components/AnalyticsConsent.astro'
      - 'astro-site/src/components/LocalEnquiry.astro'
      - 'astro-site/src/components/DisclaimerNotice.astro'
      - 'astro-site/src/pages/**'
      - 'astro-site/src/components/**'
      - 'astro-site/src/styles/**'
      - 'astro-site/scripts/lighthouse-staging.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:production
      - run: node scripts/test-production.mjs
      - run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium using runner libraries
        run: |
          npx playwright install chromium
          if ! node --input-type=module -e "import { chromium } from 'playwright'; const b=await chromium.launch(); await b.close();"; then
            sudo apt-get update -o Acquire::Retries=3
            npx playwright install-deps chromium
            node --input-type=module -e "import { chromium } from 'playwright'; const b=await chromium.launch(); await b.close();"
          fi
      - run: node scripts/test-production-browser.mjs
      - run: node scripts/indexnow-production.mjs --initial
      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate-manifest
          path: astro-site/dist-production/release-manifest.json
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Measure exact checked-out build (no deployment race)
        env:
          AK_LIGHTHOUSE_LOCAL: '1'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/ak-lighthouse-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/lighthouse-staging.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-staging
          path: astro-site/qa-lighthouse/
