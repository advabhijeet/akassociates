name: Finalize Section 16 Publication

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: finalize-section16-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    if: github.event.pull_request.head.ref == 'agent/publish-section16-msmed-compound-interest'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply Section 16 publication metadata
        run: node .github/scripts/finalize-section16-publication.js

      - name: Generate registry-driven outputs
        run: |
          node tools/sync-static-insight-cards.js
          node tools/sync-rss-feed.js

      - name: Syntax and data checks
        run: |
          node --check .github/scripts/finalize-section16-publication.js
          node --check .github/scripts/test-section16-publication.js
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
          node tools/sync-static-insight-cards.js --check
          node tools/sync-rss-feed.js --check

      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Section 16 browser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/section16-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node .github/scripts/test-section16-publication.js
          kill "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Remove temporary publication files
        run: |
          rm .github/scripts/finalize-section16-publication.js
          rm .github/scripts/test-section16-publication.js
          rm .github/workflows/finalize-section16-publication.yml

      - name: Run publication validators
        run: |
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
          node tools/sync-static-insight-cards.js --check
          node tools/sync-rss-feed.js --check
          node tools/audit-articles-structure.js --strict
          node tools/validate-seo-sitewide.js
          node tools/validate-deployment-boundary.js
          node tools/validate-documentation.js
          node tools/validate-public-assets.js
          node tools/validate-performance-remediation.js
          node tools/validate-service-consolidation.js
          node tools/validate-citadel-runtime.js
          git diff --check

      - name: Commit tested production package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Section 16 MSMED compound interest guide"

          git fetch origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort)
          expected=(
            "CHANGELOG.md"
            "assets/data/insights-registry.json"
            "feed.xml"
            "index.html"
            "legal-updates.html"
            "sitemap.xml"
            "updates/section-16-msmed-act-compound-interest.html"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            echo "Unexpected final PR scope." >&2
            printf 'Changed:\n%s\n' "${changed[*]}" >&2
            printf 'Expected:\n%s\n' "${expected_sorted[*]}" >&2
            exit 1
          fi

          git push origin HEAD:${{ github.event.pull_request.head.ref }}
