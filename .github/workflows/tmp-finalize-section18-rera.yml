name: Finalize Section 18 RERA Rewrite

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-section18-rera-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    if: github.event.pull_request.head.ref == 'agent/rewrite-section18-rera-relief-guide'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply Section 18 publication metadata
        run: node tools/tmp-finalize-section18-rera.js

      - name: Generate registry-driven outputs
        run: |
          node tools/sync-static-insight-cards.js
          node tools/sync-rss-feed.js
          node tools/sync-static-insight-cards.js --check
          node tools/sync-rss-feed.js --check

      - name: Syntax and data checks
        run: |
          node --check tools/tmp-finalize-section18-rera.js
          node --check tools/tmp-section18-browser.js
          node tools/validate-insights-registry.js --strict

      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Section 18 browser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/section18-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node tools/tmp-section18-browser.js

      - name: Remove temporary publication files
        run: |
          rm -f tools/tmp-finalize-section18-rera.js
          rm -f tools/tmp-section18-browser.js
          rm -f .github/workflows/tmp-finalize-section18-rera.yml

      - name: Run publication validators
        run: |
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
          node tools/sync-static-insight-cards.js --check
          node tools/sync-rss-feed.js --check
          node tools/audit-articles-structure.js --strict
          node tools/validate-seo-sitewide.js
          node tools/validate-deployment-boundary.js
          node tools/validate-documentation.js
          node tools/validate-public-assets.js
          node tools/validate-performance-remediation.js
          node tools/validate-service-consolidation.js
          node tools/validate-citadel-runtime.js
          git diff --check

      - name: Commit tested production package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Rewrite Section 18 RERA relief guide"

          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort)
          allowed=(
            "CHANGELOG.md"
            "assets/data/insights-registry.json"
            "feed.xml"
            "legal-updates.html"
            "sitemap.xml"
            "updates/rera-refund-interest-delayed-possession.html"
          )

          for file in "${changed[@]}"; do
            permitted=false
            for candidate in "${allowed[@]}"; do
              if [[ "$file" == "$candidate" ]]; then
                permitted=true
                break
              fi
            done
            if [[ "$permitted" != true ]]; then
              echo "Unexpected final PR file: $file" >&2
              exit 1
            fi
          done

          if [[ "${#changed[@]}" -ne "${#allowed[@]}" ]]; then
            printf 'Final changed files:\n%s\n' "${changed[*]}" >&2
            echo "Expected exactly six production files." >&2
            exit 1
          fi

          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
