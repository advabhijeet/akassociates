name: Resume Article Index Active Visibility

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/resume-article-index-active-visibility.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.head_ref == 'agent/fix-active-index-visibility'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-active-index-visibility
          fetch-depth: 0

      - name: Extract and apply stored v25 patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/apply-article-index-active-visibility.yml').read_text(encoding='utf-8')
          payloads = re.findall(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/[^\n]+", workflow)
          if len(payloads) != 2:
              raise SystemExit(f'Expected two stored payloads, found {len(payloads)}')
          Path('/tmp/apply_article_index_v25.py').write_bytes(base64.b64decode(payloads[0]))
          Path('/tmp/test_article_index_v25.cjs').write_bytes(base64.b64decode(payloads[1]))
          PY

          python3 /tmp/apply_article_index_v25.py
          node --check assets/js/themes/citadel-of-kang/article-index-direct-rail.js
          node --check assets/js/config/chambers-public-config.js
          node --check assets/js/script.js

      - name: Install Chromium test runtime
        run: |
          npm install --silent --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run long-index visibility regression
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cak-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node /tmp/test_article_index_v25.cjs

      - name: Run repository validators
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-public-assets.js
          node tools/validate-documentation.js
          node tools/validate-deployment-boundary.js
          node tools/validate-performance-remediation.js
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
          node tools/validate-citadel-runtime.js
          node tools/validate-seo-sitewide.js
          node tools/validate-service-consolidation.js
          git diff --check

      - name: Commit tested Article Index v25 rollout
        shell: bash
        run: |
          rm .github/workflows/apply-article-index-active-visibility.yml
          rm .github/workflows/resume-article-index-active-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep active Article Index entry visible"
          git push origin HEAD:agent/fix-active-index-visibility
