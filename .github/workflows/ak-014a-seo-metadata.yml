name: AK-014A SEO metadata candidate
on:
  push:
    branches: [ak-014a-seo-metadata]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/verify-legacy-inventory.mjs
      - run: npm run build:production
      - run: node scripts/test-production.mjs
      - run: node scripts/test-seo-metadata.mjs
