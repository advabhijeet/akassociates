name: Astro migration preview build
on:
  push:
    branches: [astro-migration]
    paths:
      - 'astro-site/**'
      - 'updates/**'
      - 'assets/**'
      - 'practice/**'
      - 'services/**'
      - '*.html'
      - 'feed.xml'
      - 'sitemap.xml'
      - 'tools/**'
      - '.github/workflows/astro-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install dependencies reproducibly when lockfile exists
        run: |
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Retain generated dependency lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: astro-dependency-lockfile
          path: astro-site/package-lock.json
      - run: node scripts/verify-legacy-inventory.mjs
      - run: node tools/validate-article-encoding.js
        working-directory: .
      - run: node tools/validate-insights-registry.js --strict
        working-directory: .
      - run: npm run build

      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Browser and static HTML checks
        run: node scripts/test-browser.mjs
      - name: Read-only deployed Pages HTTP audit
        if: always()
        continue-on-error: true
        run: node scripts/audit-pages-http.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ak-009-qa
          path: astro-site/qa-output/
      - name: Test new Markdown publication in disposable CI build
        run: node scripts/test-publishing.mjs
