name: Apply Article Index Active Visibility

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-article-index-active-visibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/fix-active-index-visibility'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-active-index-visibility
          fetch-depth: 0

      - name: Apply active-aware Article Index v25 patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo '' | base64 -d > /tmp/apply_article_index_v25.py
          python3 /tmp/apply_article_index_v25.py > patch.log 2>&1
          node --check assets/js/themes/citadel-of-kang/article-index-direct-rail.js >> patch.log 2>&1
          node --check assets/js/config/chambers-public-config.js >> patch.log 2>&1
          node --check assets/js/script.js >> patch.log 2>&1

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-index-v25-patch-log
          path: patch.log
          if-no-files-found: error
          retention-days: 1

      - name: Confirm patch success
        shell: bash
        run: |
          cat patch.log
          if [[ "${{ steps.patch.outcome }}" != "success" ]]; then
            exit 1
          fi

      - name: Install Chromium test runtime
        run: |
          npm install --silent --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run long-index visibility regression
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/test_article_index_v25.cjs
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cak-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node /tmp/test_article_index_v25.cjs

      - name: Run repository validators
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-public-assets.js
          node tools/validate-documentation.js
          node tools/validate-deployment-boundary.js
          node tools/validate-performance-remediation.js
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
          node tools/validate-citadel-runtime.js
          node tools/validate-seo-sitewide.js
          node tools/validate-service-consolidation.js
          git diff --check

      - name: Commit tested Article Index v25 rollout
        shell: bash
        run: |
          rm .github/workflows/apply-article-index-active-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep active Article Index entry visible"
          git push origin HEAD:agent/fix-active-index-visibility
