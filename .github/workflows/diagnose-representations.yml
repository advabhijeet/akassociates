name: AK-016 HTTP representation diagnosis
on:
  push:
    branches: [ak-live-audit]
    paths: ['astro-site/scripts/diagnose-representations.mjs', '.github/workflows/diagnose-representations.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node astro-site/scripts/diagnose-representations.mjs
