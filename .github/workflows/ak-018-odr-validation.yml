name: AK-018 ODR editorial candidate validation
on:
  push:
    branches: [ak-018-odr-validation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '08c6a7d74de8755681ea85ed87514ca75ac2e008'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Review exact scope and legacy records
        run: |
          git diff --check 270c3085497973b482aa2fd6032b28ab0409ae6b HEAD
          git diff --stat 270c3085497973b482aa2fd6032b28ab0409ae6b HEAD
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
      - name: Scan all legacy public HTML for filing channel references
        run: |
          mkdir -p /tmp/ak-odr
          git grep -in -E 'Samadhaan|MSME ODR|odr\.msme\.gov\.in' -- '*.html' ':!astro-site/**' > /tmp/ak-odr/filing-references.txt || test "$?" -eq 1
          git grep -il -E 'Samadhaan' -- '*.html' ':!astro-site/**' || test "$?" -eq 1
          git grep -in -E 'Samadhaan|MSME ODR|odr\.msme\.gov\.in' -- astro-site/src > /tmp/ak-odr/astro-references.txt || test "$?" -eq 1
          git grep -il -E 'Samadhaan' -- astro-site/src || test "$?" -eq 1
      - name: Build exact correction candidate
        working-directory: astro-site
        run: |
          npm ci --no-audit --no-fund
          node scripts/verify-legacy-inventory.mjs
          npm run build:production
          node scripts/test-production.mjs
          node scripts/test-markdown.mjs
          node scripts/test-security-headers.mjs
          node scripts/test-emailjs.mjs
      - name: Verify legacy revisions and actual native publication
        working-directory: astro-site
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const base='270c3085497973b482aa2fd6032b28ab0409ae6b';
          const old=JSON.parse(execFileSync('git',['show',base+':assets/data/insights-registry.json'],{encoding:'utf8'}));
          const now=JSON.parse(readFileSync('../assets/data/insights-registry.json','utf8'));
          assert.deepEqual(old.map(a=>[a.href,a.date]),now.map(a=>[a.href,a.date]));
          const manifest=JSON.parse(readFileSync('dist-production/release-manifest.json','utf8'));
          assert.equal(manifest.release,'08c6a7d74de8755681ea85ed87514ca75ac2e008');
          assert.equal(Object.keys(manifest.urls).length,88);
          const feed=readFileSync('dist-production/feed.xml','utf8');
          const sitemap=readFileSync('dist-production/sitemap.xml','utf8');
          assert.equal((feed.match(/<item>/g)||[]).length,52);
          const slug='msme-odr-portal-filing-procedure';
          const url='https://chambersofak.in/updates/'+slug+'.html';
          const html=readFileSync('dist-production/updates/'+slug+'.html','utf8');
          assert.ok(manifest.urls[url]);
          assert.ok(html.includes(url));
          assert.ok(html.includes('MSME ODR Portal: How to File a Delayed Payment Claim in 2026'));
          assert.ok(html.includes('citadel-thumb-'+slug+'.jpg'));
          assert.ok(html.includes('BlogPosting'));
          assert.ok(html.includes('AU2139_aA64vJ.pdf'));
          assert.ok(html.includes('277080.pdf'));
          assert.ok(feed.includes(url));
          assert.ok(sitemap.includes('<loc>'+url+'</loc>'));
          assert.ok(readFileSync('dist-production/index.html','utf8').includes(slug));
          assert.ok(readFileSync('dist-production/legal-updates.html','utf8').includes(slug));
          assert.ok(existsSync('dist-production/_ak-markdown/updates/'+slug+'.html.md'));
          assert.ok(!sitemap.includes('publishing-example'));
          assert.ok(!feed.includes('publishing-example'));
          const oldFeed=execFileSync('git',['show',base+':feed.xml'],{encoding:'utf8'});
          const items=s=>new Map([...s.matchAll(/<item>([\s\S]*?)<\/item>/g)].map(m=>[m[1].match(/<guid[^>]*>(.*?)<\/guid>/)?.[1],m[1].match(/<pubDate>(.*?)<\/pubDate>/)?.[1]]));
          const freshItems=items(feed);
          for(const [guid,date] of items(oldFeed))assert.equal(Date.parse(freshItems.get(guid)),Date.parse(date),guid);
          assert.ok(readFileSync('dist-production/updates/bihar-msefc-filing-procedure-msme-delayed-payment.html','utf8').includes('1320_2_2026.pdf'));
          console.log('Native article present in HTML, archive, homepage, RSS, sitemap and Markdown; legacy GUIDs and dates retained.');
          for(const slug of ['msme-samadhaan-filing-checklist','delhi-msefc-filing-procedure-msme-delayed-payment','bihar-msefc-filing-procedure-msme-delayed-payment','prepare-msme-delayed-payment-claim','msme-facilitation-council-process']){
            const path='updates/'+slug+'.html', u='https://chambersofak.in/'+path;
            const html=readFileSync('dist-production/'+path,'utf8');
            assert.ok(html.includes('https://odr.msme.gov.in/'),slug+' missing ODR link');
            assert.ok(html.includes('AU2139_aA64vJ.pdf'),slug+' missing parliamentary reference');
            assert.ok(html.includes('2026-11-27'),slug+' missing modified date');
            const entry=sitemap.match(/<url>[^]*?<\/url>/g).find(x=>x.includes('<loc>'+u+'</loc>'));
            assert.ok(entry.includes('<lastmod>2026-11-27</lastmod>'),slug+' sitemap lastmod');
          }
          for(const p of ['practice/msme-disputes.html','services/msme-recovery-lawyer-bihar.html','services/msme-recovery-lawyer-delhi-ncr.html','services/msme-recovery-lawyer-patna.html','updates/msme-delayed-payment.html']){
            const html=readFileSync('dist-production/'+p,'utf8');
            assert.ok(html.includes('https://odr.msme.gov.in/'),p+' missing ODR link');
            assert.ok(html.includes('AU2139_aA64vJ.pdf'),p+' missing parliamentary source');
          }
          assert.ok(readFileSync('dist-production/updates/msme-delayed-payment-vs-civil-suit-vs-arbitration.html','utf8').includes('initial ODR filing'));
          console.log('Eleven corrected pages verified; all original registry dates preserved; 88 canonical URLs and 52 RSS entries; native article included.');
          NODE
      - name: Verify exact uploaded JPEG dimensions
        working-directory: astro-site
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          def dims(p):
              b=p.read_bytes()
              assert b[:2]==b'\xff\xd8', p
              i=2
              while i<len(b)-4:
                  if b[i]!=255: raise ValueError(p)
                  while b[i]==255: i+=1
                  marker=b[i]; i+=1
                  if marker in (0xd8,0xd9): continue
                  n=int.from_bytes(b[i:i+2],'big')
                  if marker in (0xc0,0xc1,0xc2,0xc3):
                      h,w=struct.unpack('>HH',b[i+3:i+7]); return w,h
                  i+=n
              raise ValueError(p)
          for rel,expected in [('citadel-thumb-msme-odr-portal-filing-procedure.jpg',(1200,675)),('cards/citadel-thumb-msme-odr-portal-filing-procedure-640.jpg',(640,360))]:
              for root in ('public','dist-production'):
                  p=Path(root)/'assets/img/citadel'/rel
                  assert dims(p)==expected, (p,dims(p))
                  print(p,expected)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odr-reference-scan-and-candidate-manifest
          path: |
            /tmp/ak-odr/filing-references.txt
            /tmp/ak-odr/astro-references.txt
            astro-site/dist-production/release-manifest.json
