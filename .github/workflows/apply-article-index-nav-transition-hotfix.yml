name: Apply Article Index Nav Transition Hotfix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-article-index-nav-transition-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.head_ref == 'agent/fix-article-index-nav-transition'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch Article Index transition synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/js/themes/citadel-of-kang/article-index-direct-rail.js')
          text = path.read_text(encoding='utf-8')
          needle = '''  var requestUpdate = function () {
            if (ticking) return;
            ticking = true;
            window.requestAnimationFrame(update);
          };

          links.forEach(function (link) {'''.replace('          ', '')
          replacement = '''  var requestUpdate = function () {
            if (ticking) return;
            ticking = true;
            window.requestAnimationFrame(update);
          };

          var navTransitionFrame = null;
          var followNavTransition = function () {
            if (!nav || navTransitionFrame !== null) return;

            var startedAt = window.performance && typeof window.performance.now === 'function'
              ? window.performance.now()
              : Date.now();
            var currentTime = function () {
              return window.performance && typeof window.performance.now === 'function'
                ? window.performance.now()
                : Date.now();
            };
            var step = function () {
              requestUpdate();
              if (currentTime() - startedAt < 360) {
                navTransitionFrame = window.requestAnimationFrame(step);
                return;
              }

              navTransitionFrame = null;
              requestUpdate();
            };

            navTransitionFrame = window.requestAnimationFrame(step);
          };

          if (nav) {
            var navClassObserver = new MutationObserver(function () {
              requestUpdate();
              followNavTransition();
            });
            navClassObserver.observe(nav, { attributes: true, attributeFilter: ['class'] });
            nav.addEventListener('transitionrun', followNavTransition);
            nav.addEventListener('transitionend', requestUpdate);
            nav.addEventListener('transitioncancel', requestUpdate);
          }

          links.forEach(function (link) {'''.replace('          ', '')

          if needle not in text:
              raise SystemExit('Expected Article Index insertion point not found')
          if 'var navTransitionFrame = null;' in text:
              raise SystemExit('Article Index nav-transition hotfix is already present')

          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8', newline='\n')
          PY

          node --check assets/js/themes/citadel-of-kang/article-index-direct-rail.js

      - name: Install Chromium test runtime
        run: |
          npm install --silent --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run fresh-load rail regression
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cak-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          node <<'NODE'
          const { chromium } = require('playwright');

          const fail = (message, details) => {
            throw new Error(`${message}\n${JSON.stringify(details, null, 2)}`);
          };

          const translateY = (transform) => {
            if (!transform || transform === 'none') return 0;
            const matrix = transform.match(/^matrix\((.+)\)$/);
            if (matrix) return Number(matrix[1].split(',')[5]);
            const matrix3d = transform.match(/^matrix3d\((.+)\)$/);
            if (matrix3d) return Number(matrix3d[1].split(',')[13]);
            return 0;
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
              await page.goto('http://127.0.0.1:4173/updates/msme-facilitation-council-process.html', {
                waitUntil: 'domcontentloaded',
                timeout: 30000,
              });
              await page.waitForSelector('.article-index-toc a.is-active', { timeout: 15000 });
              await page.waitForSelector('.site-topbar', { timeout: 10000 });
              await page.waitForTimeout(250);

              const geometry = await page.evaluate(() => {
                const article = document.querySelector('article[data-citadel-article-index], article.article-body, article.ck-article');
                const rect = article.getBoundingClientRect();
                return {
                  articleTop: window.scrollY + rect.top,
                  articleHeight: article.offsetHeight,
                  maxScroll: document.documentElement.scrollHeight - window.innerHeight,
                };
              });
              const midY = Math.min(geometry.maxScroll, Math.round(geometry.articleTop + Math.min(geometry.articleHeight * 0.42, 1800)));
              const deeperY = Math.min(geometry.maxScroll, Math.max(midY + 500, Math.round(geometry.articleTop + geometry.articleHeight * 0.68)));

              const snapshot = () => page.evaluate(() => {
                const toc = document.querySelector('.article-index-toc');
                const article = document.querySelector('article[data-citadel-article-index], article.article-body, article.ck-article');
                const nav = document.querySelector('.nav');
                const active = toc.querySelector('a.is-active');
                const tocRect = toc.getBoundingClientRect();
                const articleRect = article.getBoundingClientRect();
                return {
                  scrollY: window.scrollY,
                  transform: getComputedStyle(toc).transform,
                  tocScrollTop: toc.scrollTop,
                  tocTop: tocRect.top,
                  tocDocumentBottom: window.scrollY + tocRect.bottom,
                  articleDocumentBottom: window.scrollY + articleRect.bottom,
                  navBottom: nav.getBoundingClientRect().bottom,
                  activeHref: active ? active.getAttribute('href') : null,
                  scrollWidth: document.documentElement.scrollWidth,
                  innerWidth: window.innerWidth,
                };
              });

              await page.evaluate((y) => window.scrollTo(0, y), midY);
              await page.waitForTimeout(140);
              const duringTransition = await snapshot();
              const liveGap = duringTransition.tocTop - duringTransition.navBottom;
              if (Math.abs(liveGap - 18) > 2) fail('Tray did not follow the compacting nav during transition', { liveGap, duringTransition });

              await page.waitForTimeout(520);
              const down = await snapshot();
              await page.evaluate((y) => window.scrollTo(0, y), deeperY);
              await page.waitForTimeout(650);
              await page.evaluate((y) => window.scrollTo(0, y), midY);
              await page.waitForTimeout(650);
              const up = await snapshot();

              const downY = translateY(down.transform);
              const upY = translateY(up.transform);
              if (Math.abs(downY - upY) > 1) fail('Stable downward/upward rail transforms differ', { downY, upY, down, up });
              if (down.tocScrollTop !== 0 || up.tocScrollTop !== 0) fail('Internal Article Index scrolling detected', { down, up });
              if (down.activeHref !== up.activeHref) fail('Active title became stale on upward scroll', { down, up });
              if (down.scrollWidth > down.innerWidth) fail('Desktop horizontal overflow detected', down);

              let end = null;
              for (let attempt = 0; attempt < 3; attempt += 1) {
                const maximum = await page.evaluate(() => Math.max(0, document.documentElement.scrollHeight - window.innerHeight));
                await page.evaluate((y) => window.scrollTo(0, y), maximum);
                await page.waitForTimeout(650);
                end = await snapshot();
              }
              if (Math.abs(end.tocDocumentBottom - end.articleDocumentBottom) > 2) fail('Tray did not clamp at article bottom', end);

              console.log(JSON.stringify({ status: 'PASS', duringTransition, down, up, end }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

      - name: Run repository validators
        shell: bash
        run: |
          node tools/validate-public-assets.js
          node tools/validate-performance-remediation.js
          node tools/validate-citadel-runtime.js
          node tools/validate-documentation.js
          git diff --check

      - name: Commit tested hotfix to branch
        shell: bash
        run: |
          rm .github/workflows/apply-article-index-nav-transition-hotfix.yml
          git config user.name "Chambers Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/themes/citadel-of-kang/article-index-direct-rail.js .github/workflows/apply-article-index-nav-transition-hotfix.yml
          git commit -m "Keep Article Index aligned during nav transition"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
