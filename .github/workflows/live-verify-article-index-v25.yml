name: Live Article Index v25 Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/live-verify-article-index-v25.yml'
      - 'tools/tmp-live-verify-article-index-v25.cjs'

permissions:
  contents: read

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium test runtime
        run: |
          npm install --silent --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify live Article Index v25
        run: node tools/tmp-live-verify-article-index-v25.cjs
