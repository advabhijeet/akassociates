name: Astro migration preview build
on:
  push:
    branches: [astro-migration]
    paths:
      - 'astro-site/**'
      - 'updates/**'
      - 'assets/**'
      - 'practice/**'
      - 'services/**'
      - '*.html'
      - 'feed.xml'
      - 'sitemap.xml'
      - 'tools/**'
      - '.github/workflows/astro-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm install --no-audit --no-fund
      - run: node scripts/verify-legacy-inventory.mjs
      - run: node tools/validate-article-encoding.js
        working-directory: .
      - run: node tools/validate-insights-registry.js --strict
        working-directory: .
      - run: npm run build
