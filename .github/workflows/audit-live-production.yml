name: AK-011 and AK-012 live production audit
on:
  push:
    branches: [ak-live-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Audit live production (GET only)
        run: node astro-site/scripts/audit-live-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-production-audit
          path: live-audit-report.json
