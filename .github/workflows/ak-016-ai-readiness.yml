name: AK-016 AI readiness candidate
on:
  push:
    branches: [ak-016-ai-readiness, astro-migration]
    paths:
      - 'robots.txt'
      - 'astro-site/**'
      - '.github/workflows/ak-016-ai-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/verify-legacy-inventory.mjs
      - run: npm run build:production
      - run: node scripts/test-production.mjs
      - run: node scripts/test-markdown.mjs
