name: Live Article Index v24 Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/live-article-index-v24.yml'
      - 'tools/live-verify-article-index-v24.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-article-index-v24-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-site:
    name: Verify deployed Article Index v24
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --silent --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Normalize verifier expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/live-verify-article-index-v24.cjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"id: \'citadel-article-index-v24\'"': '\'"id": "citadel-article-index-v24"\'',
              '"version: \'article-index-v24\'"': '\'"version": "article-index-v24"\'',
              '"id: \'citadel-thumbnail-frames-v9\'"': '\'"id": "citadel-thumbnail-frames-v9"\'',
              '"version: \'thumbnail-frames-v9\'"': '\'"version": "thumbnail-frames-v9"\'',
              'await page.waitForTimeout(300);': 'await page.waitForTimeout(650);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing verifier marker: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run live verification
        id: live_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/live-verify-article-index-v24.cjs > live-verification.log 2>&1

      - name: Upload complete verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-index-v24-live-verification
          path: live-verification.log
          if-no-files-found: error
          retention-days: 1

      - name: Report verification result
        if: always()
        shell: bash
        run: |
          tail -n 80 live-verification.log || true
          if [[ "${{ steps.live_check.outcome }}" != "success" ]]; then
            exit 1
          fi
