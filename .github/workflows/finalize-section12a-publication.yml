name: Finalize Section 12A Publication

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-section12a-publication.yml'
      - 'tools/tmp-finalize-section12a.py'
      - 'tools/tmp-test-section12a.cjs'
      - 'updates/section-12a-commercial-courts-pre-institution-mediation.html'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.head_ref == 'agent/publish-section12a-pre-institution-mediation'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/publish-section12a-pre-institution-mediation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply Section 12A publication metadata
        run: |
          python3 tools/tmp-finalize-section12a.py
          node tools/sync-static-insight-cards.js
          node tools/sync-rss-feed.js

      - name: Syntax and generated-output checks
        run: |
          set -euo pipefail
          python3 -m json.tool assets/data/insights-registry.json >/dev/null
          node --check assets/js/script.js
          node --check assets/js/config/chambers-public-config.js
          node --check assets/js/themes/citadel-of-kang/article-index-direct-rail.js
          node --check tools/sync-static-insight-cards.js
          node --check tools/sync-rss-feed.js
          grep -q 'updates/section-12a-commercial-courts-pre-institution-mediation.html' index.html
          grep -q 'updates/section-12a-commercial-courts-pre-institution-mediation.html' legal-updates.html
          grep -q 'https://chambersofak.in/updates/section-12a-commercial-courts-pre-institution-mediation.html' feed.xml
          grep -q 'https://chambersofak.in/updates/section-12a-commercial-courts-pre-institution-mediation.html' sitemap.xml

      - name: Install Chromium test runtime
        run: |
          npm install --silent --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run Section 12A browser regression
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cak-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tools/tmp-test-section12a.cjs

      - name: Run publication validators
        run: |
          set -euo pipefail
          node tools/validate-article-encoding.js
          node tools/validate-insights-registry.js --strict
          node tools/sync-static-insight-cards.js --check
          node tools/sync-rss-feed.js --check
          node tools/audit-articles-structure.js --strict
          node tools/validate-seo-sitewide.js
          node tools/validate-deployment-boundary.js
          node tools/validate-documentation.js
          node tools/validate-public-assets.js
          node tools/validate-performance-remediation.js
          node tools/validate-service-consolidation.js
          node tools/validate-citadel-runtime.js
          git diff --check

      - name: Commit tested production package
        run: |
          rm .github/workflows/finalize-section12a-publication.yml
          rm tools/tmp-finalize-section12a.py
          rm tools/tmp-test-section12a.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Section 12A pre-institution mediation guide"
          git push origin HEAD:agent/publish-section12a-pre-institution-mediation
