name: AK-016 DNSSEC validation
on:
  push:
    branches: [ak-live-audit]
    paths: ['astro-site/scripts/verify-dnssec.mjs', '.github/workflows/verify-dnssec.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node astro-site/scripts/verify-dnssec.mjs
